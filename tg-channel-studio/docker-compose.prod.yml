# Прод-оверлей: добавляет Caddy (TLS) и НЕ публикует внутренние порты наружу.
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# В этом оверлее backend/postgres/redis доступны только внутри docker-сети.
services:
  db:
    ports: []          # не выставляем 5432 наружу

  backend:
    ports: []          # доступ только через app.domain/api (Next rewrite)

  frontend:
    ports: []

  marketing:
    ports: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - marketing

volumes:
  caddy_data:
  caddy_config:
