name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint
        run: ruff check app
      - name: Test
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: ci-secret-key-long-enough-1234567890
          STRIPE_WEBHOOK_SECRET: whsec_test
          STRIPE_PRICE_CREDITS: '{"price_test": 1000}'
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, marketing]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
