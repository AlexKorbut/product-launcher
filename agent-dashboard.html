<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Launcher AI — Agent Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* ─── AGENT GRID ─── */
  .agent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .agent-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    transition: transform .15s, box-shadow .15s;
  }
  .agent-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .agent-status {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  .status-idle { background: var(--muted); animation: none; }
  .status-working { background: var(--green); }
  .status-waiting { background: var(--yellow); }
  .status-error { background: var(--red); }
  .status-done { background: var(--purple); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .agent-emoji { font-size: 36px; text-align: center; margin: 8px 0; }
  .agent-name { font-weight: 600; text-align: center; font-size: 13px; }
  .agent-role { color: var(--muted); font-size: 11px; text-align: center; margin-top: 2px; }
  .agent-task {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .agent-model {
    font-size: 10px;
    color: var(--blue);
    text-align: center;
    margin-top: 4px;
  }

  /* ─── KANBAN ─── */
  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
  .kanban-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 120px;
  }
  .kanban-col h3 { font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .kanban-col.todo h3 { color: var(--muted); }
  .kanban-col.ready h3 { color: var(--yellow); }
  .kanban-col.progress h3 { color: var(--green); }
  .kanban-col.done h3 { color: var(--purple); }
  .kanban-task {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .kanban-task .task-id { color: var(--blue); font-weight: 600; }
  .kanban-task .task-agent { color: var(--muted); font-size: 10px; margin-top: 2px; }

  /* ─── LOG ─── */
  .log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    max-height: 200px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Cascadia Code', monospace;
    font-size: 12px;
  }
  .log h3 { margin-bottom: 8px; font-size: 13px; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(48,54,61,0.5); }
  .log-time { color: var(--muted); margin-right: 8px; }
  .log-agent { color: var(--blue); margin-right: 8px; }
  .log-ok { color: var(--green); }
  .log-err { color: var(--red); }

  .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>

<h1>🤖 Product Launcher AI</h1>
<p class="subtitle">12 агентов · 2081 пост в базе знаний · бюджет $0.64-1.04/запуск</p>

<!-- ─── AGENT CARDS ─── -->
<div class="agent-grid" id="agents"></div>

<!-- ─── KANBAN ─── -->
<h2 style="font-size:16px;margin-bottom:12px;">📋 Kanban Board</h2>
<div class="kanban">
  <div class="kanban-col todo">
    <h3>📥 Todo</h3>
    <div id="kanban-todo"></div>
  </div>
  <div class="kanban-col ready">
    <h3>⏳ Ready</h3>
    <div id="kanban-ready"></div>
  </div>
  <div class="kanban-col progress">
    <h3>⚡ In Progress</h3>
    <div id="kanban-progress"></div>
  </div>
  <div class="kanban-col done">
    <h3>✅ Done</h3>
    <div id="kanban-done"></div>
  </div>
</div>

<!-- ─── LIVE LOG ─── -->
<h2 style="font-size:16px;margin-bottom:12px;">📡 Live Log</h2>
<div class="log" id="log"></div>

<p class="footer">🔄 Auto-refresh every 3s · Product Launcher AI v0.1</p>

<script>
// ─── AGENT EMOJI MAP ───
const EMOJIS = {
  "ocr-extractor": "👁️",
  "product-analyst": "🔬", 
  "content-strategist": "📝",
  "website-gen": "🌐",
  "tiktok-gen": "🎵",
  "instagram-gen": "📸",
  "threads-gen": "🧵",
  "asset-gen": "🎨",
  "qa-text": "✅",
  "qa-visual": "🖼️",
  "qa-cross": "🔗",
  "orchestrator": "🧠",
};
const MODELS = {
  "ocr-extractor": "DeepSeek-OCR 2",
  "product-analyst": "DeepSeek-V4-Pro",
  "content-strategist": "Claude Sonnet 4",
  "website-gen": "Codex / GPT-5.5",
  "tiktok-gen": "Claude Sonnet 4",
  "instagram-gen": "Claude Sonnet 4",
  "threads-gen": "Claude Sonnet 4",
  "asset-gen": "DALL·E 3 / SDXL",
  "qa-text": "GPT-4o / DeepSeek",
  "qa-visual": "DeepSeek-V4-Pro",
  "qa-cross": "DeepSeek-V4-Pro",
  "orchestrator": "DeepSeek-V4-Pro",
};
const STATUS_LABELS = {
  "todo": "Ожидает",
  "in_progress": "⚡ Работает",
  "done": "✅ Завершён",
  "failed": "❌ Ошибка",
};
const STATUS_CSS = {
  "todo": "idle",
  "in_progress": "working",
  "done": "done",
  "failed": "error",
};

let AGENTS = [];
let KANBAN = { todo: [], in_progress: [], done: [], failed: [] };
let LOG = [];

async function fetchState() {
  try {
    const resp = await fetch('/api/kanban');
    const data = await resp.json();

    // Build agent cards from task data
    const agentMap = {};
    for (const t of [...(data.kanban.todo||[]), ...(data.kanban.in_progress||[]), ...(data.kanban.done||[]), ...(data.kanban.failed||[])]) {
      if (!agentMap[t.agent]) {
        agentMap[t.agent] = { agent: t.agent, total: 0, active: 0, done: 0, failed: 0, status: 'idle' };
      }
      agentMap[t.agent].total++;
      if (t.status === 'in_progress') { agentMap[t.agent].active++; agentMap[t.agent].status = 'working'; }
      if (t.status === 'done') agentMap[t.agent].done++;
      if (t.status === 'failed') { agentMap[t.agent].failed++; agentMap[t.agent].status = 'error'; }
    }

    AGENTS = Object.values(agentMap);
    KANBAN = data.kanban || { todo: [], in_progress: [], done: [], failed: [] };

    // Build log from tasks
    LOG = [];
    for (const t of [...(KANBAN.done||[]), ...(KANBAN.failed||[])]) {
      LOG.push({
        time: (t.completed_at || '').slice(11, 19) || '--:--:--',
        agent: t.agent,
        msg: t.status === 'done' ? t.title + ' ✓' : t.title + ' ✗',
        ok: t.status === 'done',
      });
    }
    for (const t of (KANBAN.in_progress||[])) {
      LOG.push({
        time: (t.claimed_at || '').slice(11, 19) || '--:--:--',
        agent: t.agent,
        msg: '⏳ ' + t.title + '...',
        ok: true,
      });
    }
  } catch(e) {}
}

// ─── KANBAN TASKS ───
const KANBAN = {
  todo: [
    { id: "T11", title: "Кросс-платформенная проверка", agent: "QA Cross" },
    { id: "T10", title: "Визуальный QA output", agent: "QA Visual" },
    { id: "T9",  title: "Генерация ассетов", agent: "Asset Gen" },
  ],
  ready: [
    { id: "T8",  title: "Threads контент", agent: "Threads Gen" },
    { id: "T7",  title: "Instagram контент", agent: "Instagram Gen" },
  ],
  progress: [
    { id: "T5",  title: "TikTok сценарии", agent: "TikTok Gen" },
    { id: "T4",  title: "Генерация сайта", agent: "Website Gen" },
  ],
  done: [
    { id: "T3",  title: "Контент-стратегия", agent: "Content Strategist" },
    { id: "T2",  title: "Анализ продукта", agent: "Product Analyst" },
    { id: "T1",  title: "OCR брошюры", agent: "OCR Extractor" },
  ],
};

// ─── LOG ───
let LOG = [
  { time: "11:45:02", agent: "Оркестратор", msg: "Pipeline started for product #1", ok: true },
  { time: "11:45:04", agent: "OCR Extractor", msg: "Extracted text from 3 images (98% confidence)", ok: true },
  { time: "11:45:09", agent: "Product Analyst", msg: "KB populated: product + brand + market", ok: true },
  { time: "11:45:17", agent: "Content Strategist", msg: "Strategy ready: friendly tone, IG+TikTok focus", ok: true },
  { time: "11:45:18", agent: "Оркестратор", msg: "Dispatching parallel generation (4 agents)", ok: true },
  { time: "11:45:35", agent: "Website Gen", msg: "Landing page generated: 3 sections, mobile-first", ok: true },
];

// ─── RENDER ───
function statusClass(s) {
  return 'status-' + s;
}
function statusLabel(s) {
  const labels = { idle: 'Ожидает', working: 'Работает', waiting: 'Готов', error: 'Ошибка', done: 'Завершён' };
  return labels[s] || s;
}

function renderAgents() {
  const grid = document.getElementById('agents');
  if (AGENTS.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;">Ожидание агентов...</div>';
    return;
  }
  grid.innerHTML = AGENTS.map(a => {
    const emoji = EMOJIS[a.agent] || '🤖';
    const model = MODELS[a.agent] || '?';
    const status = a.status || 'idle';
    const label = STATUS_LABELS[status] || status;
    return `
    <div class="agent-card">
      <div class="agent-status status-${STATUS_CSS[status] || 'idle'}" title="${label}"></div>
      <div class="agent-emoji">${emoji}</div>
      <div class="agent-name">${a.agent}</div>
      <div class="agent-task">${label} | ${a.done||0}/${a.total||0} задач</div>
      <div class="agent-model">${model}</div>
    </div>`;
  }).join('');
}

function renderKanban() {
  const statuses = ['todo','in_progress','done','failed'];
  const labels = ['📥 Todo','⚡ In Progress','✅ Done','❌ Failed'];
  for (let i = 0; i < 4; i++) {
    const col = statuses[i];
    const el = document.getElementById('kanban-' + (col === 'todo' ? 'todo' : col === 'in_progress' ? 'progress' : col === 'done' ? 'done' : 'done'));
    // Map 'failed' to a different display
    const displayEl = document.getElementById(col === 'failed' ? 'kanban-done' : 'kanban-' + (col === 'todo' ? 'todo' : col === 'in_progress' ? 'progress' : 'done'));
    if (!displayEl) continue;
    const tasks = (KANBAN[col] || []).slice(0, 10);
    displayEl.parentElement.querySelector('h3').textContent = labels[i] + ' (' + tasks.length + ')';
    displayEl.innerHTML = tasks.map(t => `
      <div class="kanban-task">
        <span class="task-id">${t.id}</span> ${t.title}
        <div class="task-agent">👤 ${t.agent}</div>
      </div>
    `).join('');
  }
}

function renderLog() {
  document.getElementById('log').innerHTML = LOG.map(e => `
    <div class="log-entry">
      <span class="log-time">${e.time}</span>
      <span class="log-agent">[${e.agent}]</span>
      <span class="${e.ok ? 'log-ok' : 'log-err'}">${e.msg}</span>
    </div>
  `).join('');
}

async function tick() {
  await fetchState();
  renderAgents();
  renderKanban();
  renderLog();
}

(async function init() {
  await tick();
  renderAgents();
  renderKanban();
  renderLog();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
