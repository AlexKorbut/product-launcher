<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" role="img" aria-label="Morning Paper">
  <!-- Solid red background: Bauhaus geometry, zero ornament -->
  <rect fill="#e63946" width="800" height="80"/>

  <!-- Main title: MORNING PAPER left-aligned, white, DM Sans -->
  <text x="24" y="54"
        font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="-1">MORNING PAPER</text>

  <!-- White vertical pipe separator -->
  <rect x="594" y="20" width="2" height="40" fill="rgba(255,255,255,0.5)"/>

  <!-- Date / edition placeholder text, right side -->
  <text x="606" y="38"
        font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9"
        font-weight="400"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="0.5">INTERNATIONAL EDITION</text>
  <text x="606" y="52"
        font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9"
        font-weight="400"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="0.5">EST. 2024</text>
</svg>
