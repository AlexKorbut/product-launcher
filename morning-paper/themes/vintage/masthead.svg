<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" role="img" aria-label="The Morning Paper">
  <!-- Triple Art Deco rule at top: 6px + 2px + 1px separated by 2px gaps -->
  <rect x="0" y="0" width="900" height="6" fill="#0a0a08"/>
  <rect x="0" y="10" width="900" height="2" fill="#0a0a08"/>
  <rect x="0" y="15" width="900" height="1" fill="#0a0a08"/>

  <!-- Main title: THE MORNING PAPER in Playfair Display SC -->
  <text x="450" y="76"
        text-anchor="middle"
        font-family="'Playfair Display SC', 'Playfair Display', Georgia, serif"
        font-size="72"
        font-weight="700"
        fill="#0a0a08"
        letter-spacing="-2"
        text-decoration="none"
        style="text-transform: uppercase;">THE MORNING PAPER</text>

  <!-- Thin rule below title -->
  <rect x="0" y="87" width="900" height="1" fill="#0a0a08"/>
  <rect x="0" y="91" width="900" height="2.5" fill="#0a0a08"/>

  <!-- Art Deco corner decorations: small geometric marks -->
  <rect x="12" y="22" width="8" height="1" fill="#0a0a08"/>
  <rect x="12" y="24" width="5" height="1" fill="#0a0a08"/>
  <rect x="880" y="22" width="8" height="1" fill="#0a0a08"/>
  <rect x="883" y="24" width="5" height="1" fill="#0a0a08"/>
</svg>
